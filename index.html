:root {
  --bg: #E9EEE6; --surface: #FBFCF8; --sunken: #DCE4D8; --ink: #17231C; --ink-2: #4A584F; --line: #BCC8BC;
  --green: #1E4635; --green-ink: #FBFCF8; --mark: #2C6B50; --tag: #F7C600; --tag-edge: #D3A900; --tag-ink: #14190F;
  --good: #1D6B45; --warn: #8A5A00; --warn-bg: #FBEBC4; --bad: #A82A1E; --bad-bg: #F8DDD8;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", -apple-system, system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111A15; --surface: #1A2620; --sunken: #0C130F; --ink: #EDF2EA; --ink-2: #A9B8AC; --line: #34453A;
  --green: #17372A; --green-ink: #EDF2EA; --mark: #5FBE93; --tag-edge: #A98700;
  --good: #6FD3A0; --warn: #F0C766; --warn-bg: #3A2E10; --bad: #FF9C8F; --bad-bg: #421C17; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111A15; --surface: #1A2620; --sunken: #0C130F; --ink: #EDF2EA; --ink-2: #A9B8AC; --line: #34453A;
  --green: #17372A; --green-ink: #EDF2EA; --mark: #5FBE93; --tag-edge: #A98700;
  --good: #6FD3A0; --warn: #F0C766; --warn-bg: #3A2E10; --bad: #FF9C8F; --bad-bg: #421C17; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 17px/1.4 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 800 38px/1 var(--display); }
h2 { font: 800 25px/1.1 var(--display); text-wrap: balance; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 18px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
.wrap > * { min-width: 0; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 15px; }
.num { font-variant-numeric: tabular-nums; }

/* Brinco */
.tag-stage { display: grid; justify-items: center; gap: 8px; }
.tag { position: relative; background: var(--tag); color: var(--tag-ink);
  border-radius: 50% 50% 20px 20px / 34% 34% 20px 20px; box-shadow: inset 0 0 0 3px var(--tag-edge); }
.tag::before { content: ""; position: absolute; top: 9%; left: 50%; transform: translateX(-50%);
  width: 15%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 3px var(--tag-edge); }
.tag-big { width: min(100%, 290px); height: 196px; display: grid; align-items: end; padding: 0 12px 20px; }
.tag-big:focus-within { box-shadow: inset 0 0 0 3px var(--tag-edge), 0 0 0 4px var(--mark); }
.tag-big label { position: absolute; top: 70px; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 15px; }
#brinco { width: 100%; border: 0; background: transparent; outline: 0; text-align: center; color: var(--tag-ink);
  font: 800 66px/1.1 var(--display); text-transform: uppercase; font-variant-numeric: tabular-nums; }
#brinco::placeholder { color: var(--tag-ink); opacity: .28; }
.tag-mini { flex: none; width: 62px; height: 70px; display: grid; place-items: end center; padding: 0 3px 8px;
  font: 800 23px/1 var(--display); font-variant-numeric: tabular-nums; }
.tag-mini.longo { font-size: 16px; }
.tag-mini::before { box-shadow: inset 0 0 0 2px var(--tag-edge); }

.sugest { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { min-height: 44px; padding: 8px 15px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.info { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); }
.info b { font-weight: 600; }
.info.novo { background: var(--warn-bg); border-color: transparent; color: var(--ink); }
.campo { display: grid; gap: 5px; min-width: 0; }
.campo > span { font-weight: 600; font-size: 15px; }
.campo small { color: var(--ink-2); font-size: 14px; }
input.txt, select.txt { width: 100%; min-height: 50px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--surface); font-size: 17px; min-width: 0; }
input[type="date"].txt { -webkit-appearance: none; appearance: none; }
.lin2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pesobox { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 16px; }
.pesobox:focus-within { border-color: var(--mark); }
#peso { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; text-align: right; font: 800 62px/1.15 var(--display); font-variant-numeric: tabular-nums; }
#peso::placeholder { color: var(--ink-2); opacity: .35; }
.pesobox span { font: 600 26px var(--display); color: var(--ink-2); }
.live { min-height: 22px; font-size: 16px; color: var(--ink-2); font-weight: 600; text-align: right; }

.btn { min-height: 52px; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.pri { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.btn.big { width: 100%; min-height: 64px; font: 800 27px var(--display); }
.btn.perigo { color: var(--bad); border-color: var(--bad); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns .full { grid-column: 1 / -1; }
.icone { width: 48px; height: 48px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
.link { background: none; border: 0; padding: 6px 2px; min-height: 44px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.recibo { padding: 14px 16px; border-radius: 12px; background: var(--green); color: var(--green-ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.recibo strong { font: 800 26px/1.1 var(--display); display: block; }
.recibo .link { color: inherit; flex: none; }

.linha { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; text-align: left; border: 0; border-bottom: 2px solid var(--line); background: var(--surface); }
.lista { border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
.lista .linha:last-child { border-bottom: 0; }
.linha .meio { flex: 1; min-width: 0; }
.linha .meio b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.linha .fim { text-align: right; flex: none; }
.linha .fim b { font: 800 26px/1.1 var(--display); font-variant-numeric: tabular-nums; display: block; }
.st { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 14px; font-weight: 600; background: var(--sunken); }
.st.mau { background: var(--bad-bg); color: var(--bad); }
.st.ok { color: var(--good); }

.placar { display: grid; grid-template-columns: 1fr 1fr; background: var(--green); color: var(--green-ink); border-radius: 14px; overflow: hidden; }
.placar div { padding: 13px 16px; }
.placar b { display: block; font: 800 42px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.placar div:nth-child(5) { grid-column: 1 / -1; }
.placar span { font-size: 15px; opacity: .88; }
.bloco { display: grid; gap: 10px; }
.bloco > * { min-width: 0; }
.aviso { padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.aviso.erro { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.aviso .link { flex: none; }
.grafico { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
.grafico svg { display: block; width: 100%; height: auto; }
.grafico svg text { fill: var(--ink-2); font: 500 12px var(--body); font-variant-numeric: tabular-nums; }
.grafico .forte { fill: var(--ink); font-weight: 600; }
.leitura { min-height: 24px; padding: 2px 4px 0; font-weight: 600; font-size: 15px; }
.scroll { overflow-x: auto; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 14px; font-weight: 600; color: var(--ink-2); }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
.vazio { padding: 26px 18px; text-align: center; background: var(--surface); border: 2px dashed var(--line); border-radius: 12px; display: grid; gap: 12px; justify-items: center; }
.busca { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.busca .full { grid-column: 1 / -1; }

nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav button { min-height: 54px; border: 0; border-radius: 10px; background: transparent; font: 800 21px var(--display); color: var(--ink-2); }
nav button[aria-current="page"] { background: var(--green); color: var(--green-ink); }

.fundo { position: fixed; z-index: 40; inset: 0; background: rgba(8, 14, 10, .55); display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 640px; max-height: 90dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet > * { min-width: 0; }
.sheet-top { display: flex; align-items: center; gap: 12px; }
.sheet-top > div { flex: 1; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--line); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.stats div { background: var(--surface); padding: 9px 10px; min-width: 0; }
.stats b { display: block; font: 800 27px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; color: var(--ink-2); }
#toast { position: fixed; z-index: 60; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: 460px; margin: 0 auto; padding: 12px 16px; background: var(--ink); color: var(--bg); font-weight: 600; border-radius: 10px; text-align: center; }
@media (min-width: 620px) { .placar { grid-template-columns: repeat(4, 1fr); } .placar div:nth-child(5) { grid-column: auto; } }
@media (prefers-reduced-motion: no-preference) { .recibo { animation: entra .18s ease-out; } @keyframes entra { from { transform: translateY(6px); } } }
</style>
</head>
<body>
<main class="wrap" id="v-pesar">
  <form id="form-pesar" class="bloco" autocomplete="off" novalidate>
    <div class="head">
      <h1>Pesar</h1>
      <label class="small muted" for="data-pesagem">Data <input class="txt" type="date" id="data-pesagem" style="min-height:44px;padding:6px 8px;width:auto"></label>
    </div>
    <div id="recibo" hidden></div>
    <div class="tag-stage">
      <div class="tag tag-big">
        <label for="brinco">Brinco</label>
        <input id="brinco" enterkeyhint="next" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="12" placeholder="000">
      </div>
      <div class="sugest" id="sugestoes"></div>
    </div>
    <div id="info-animal"></div>
    <div id="novo-animal" class="bloco" hidden>
      <div class="campo"><span>Categoria</span><div class="chips" id="cat-chips"></div></div>
      <label class="campo"><span>Lote ou curral</span><input class="txt" id="novo-lote" placeholder="Opcional" list="lotes-lista"></label>
    </div>
    <div>
      <label class="campo" for="peso"><span>Peso</span></label>
      <div class="pesobox"><input id="peso" inputmode="decimal" enterkeyhint="done" placeholder="0" maxlength="7"><span>kg</span></div>
      <div class="live num" id="peso-live"></div>
    </div>
    <p id="erro-pesar" class="aviso erro" hidden></p>
    <button class="btn pri big" type="submit">Salvar pesagem</button>
    <div id="sessao"></div>
  </form>
  <datalist id="lotes-lista"></datalist>
</main>

<main class="wrap" id="v-rebanho" hidden>
  <div class="head"><h1>Rebanho</h1><span class="muted num" id="rebanho-conta"></span></div>
  <div class="busca">
    <input class="txt full" id="busca" type="search" placeholder="Buscar brinco ou lote" aria-label="Buscar brinco ou lote">
    <select class="txt" id="filtro-cat" aria-label="Categoria"></select>
    <select class="txt" id="ordem" aria-label="Ordenar">
      <option value="brinco">Por brinco</option><option value="peso">Mais pesados</option>
      <option value="gmd">Menor ganho</option><option value="antigo">Pesados há mais tempo</option>
    </select>
    <div class="chips full" id="filtro-status"></div>
  </div>
  <div id="lista-animais"></div>
</main>

<main class="wrap" id="v-painel" hidden>
  <div class="head"><h1>Painel</h1><button class="icone" data-a="ajustes" aria-label="Ajustes e backup"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
  <div id="painel"></div>
</main>

<nav aria-label="Principal">
  <button data-v="pesar">Pesar</button><button data-v="rebanho">Rebanho</button><button data-v="painel">Painel</button>
</nav>
<div id="sheets"></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
const CHAVE = "curral.v1";
const CATEGORIAS = ["Bezerro", "Garrote", "Novilha", "Boi", "Vaca"];
const PREVIEW = !!window.CURRAL_PREVIEW;
const CONFIG_PADRAO = { rendimento: 52, precoArroba: null, pesoAlvo: null, gmdMinimo: 1, diasSemPesar: 30 };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Datas sempre locais: toISOString viraria o dia às 21h no Brasil. */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoje = () => iso(new Date());
const diaN = s => { const [a, m, d] = s.split("-").map(Number); return Date.UTC(a, m - 1, d) / 864e5; };
const diasEntre = (a, b) => diaN(b) - diaN(a);
const dataBR = s => { const [a, m, d] = s.split("-"); return `${d}/${m}/${a.slice(2)}`; };
const somaDias = (s, n) => { const [a, m, d] = s.split("-").map(Number); return iso(new Date(a, m - 1, d + n)); };

const fmt = (n, c = 0) => Number(n).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const kg = n => fmt(n, Number.isInteger(+n) ? 0 : 1) + " kg";
const sinal = (n, c = 0) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n), c);
function parseNum(t) {
  let s = String(t ?? "").trim().replace(/\s/g, "");
  if (/^\d{1,3}\.\d{3}(,\d+)?$/.test(s)) s = s.replace(".", "");
  s = s.replace(",", ".");
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const normBrinco = s => String(s ?? "").trim().toUpperCase().replace(/\s+/g, " ");

/* Dados */
const vazio = () => ({ versao: 1, animais: [], pesagens: [], config: { ...CONFIG_PADRAO }, ultimoBackup: null, exemplo: false });
let db = vazio(), salvouOk = true;
function carregar() {
  try { const t = localStorage.getItem(CHAVE); if (t) db = sanear(JSON.parse(t)); } catch (e) { salvouOk = false; }
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); salvouOk = true; } catch (e) { salvouOk = false; }
}
function sanear(o) {
  if (!o || !Array.isArray(o.animais) || !Array.isArray(o.pesagens)) throw new Error("formato");
  const dataOk = d => /^\d{4}-\d{2}-\d{2}$/.test(d);
  const animais = o.animais.filter(a => a && a.id && a.brinco).map(a => ({
    id: String(a.id), brinco: normBrinco(a.brinco), categoria: CATEGORIAS.includes(a.categoria) ? a.categoria : "Boi",
    lote: String(a.lote ?? ""), raca: String(a.raca ?? ""), obs: String(a.obs ?? ""),
    saida: a.saida && dataOk(a.saida.data) ? { tipo: a.saida.tipo === "Morte" ? "Morte" : "Venda", data: a.saida.data, peso: +a.saida.peso || null, valor: +a.saida.valor || null } : null }));
  const ids = new Set(animais.map(a => a.id));
  const pesagens = o.pesagens.filter(p => p && ids.has(String(p.animalId)) && dataOk(p.data) && +p.peso > 0)
    .map(p => ({ id: String(p.id || novoId()), animalId: String(p.animalId), data: p.data, peso: +p.peso }));
  return { versao: 1, animais, pesagens, config: { ...CONFIG_PADRAO, ...(o.config || {}) }, ultimoBackup: o.ultimoBackup || null, exemplo: !!o.exemplo };
}
const animal = id => db.animais.find(a => a.id === id);
const ativoPorBrinco = b => db.animais.find(a => a.brinco === b && !a.saida);
const pesagensDe = id => db.pesagens.filter(p => p.animalId === id).sort((x, y) => x.data.localeCompare(y.data));
const arrobas = p => p * (db.config.rendimento / 100) / 15;
function metricas(id) {
  const ps = pesagensDe(id);
  if (!ps.length) return { ps, ultimo: null };
  const pri = ps[0], ult = ps[ps.length - 1], dias = diasEntre(pri.data, ult.data);
  return { ps, pri, ultimo: ult, ganho: ult.peso - pri.peso, dias, gmd: dias > 0 ? (ult.peso - pri.peso) / dias : null };
}
const ativos = () => db.animais.filter(a => !a.saida);
function subtitulo(a) { return [a.categoria, a.lote].filter(Boolean).join(", "); }
function tagMini(b) { return `<span class="tag tag-mini${b.length > 4 ? " longo" : ""}">${esc(b)}</span>`; }

/* Navegação */
let vista = "pesar";
function ir(v) {
  vista = v;
  ["pesar", "rebanho", "painel"].forEach(n => { $("#v-" + n).hidden = n !== v; });
  $$("nav button").forEach(b => b.dataset.v === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  render();
}
function render() {
  if (vista === "rebanho") renderRebanho();
  if (vista === "painel") renderPainel();
  if (vista === "pesar") { renderPesar(); renderSessao(); }
  $("#lotes-lista").innerHTML = lotes().map(l => `<option value="${esc(l)}"></option>`).join("");
}
const lotes = () => [...new Set(db.animais.map(a => a.lote).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3000); }

/* Folhas e confirmação (sem alert/confirm do navegador) */
function abrir(html) {
  const f = document.createElement("div"); f.className = "fundo";
  f.innerHTML = `<section class="sheet" role="dialog" aria-modal="true">${html}</section>`;
  f.addEventListener("click", e => { if (e.target === f) fechar(f); });
  $("#sheets").append(f); document.body.style.overflow = "hidden";
  return f;
}
function fechar(f) {
  (f || $("#sheets").lastElementChild)?.remove();
  if (!$("#sheets").children.length) document.body.style.overflow = "";
}
function confirmar(titulo, texto, ok, perigo) {
  return new Promise(res => {
    const f = abrir(`<h2>${esc(titulo)}</h2><p>${esc(texto)}</p><div class="btns"><button class="btn" data-r="0">Voltar</button><button class="btn ${perigo ? "perigo" : "pri"}" data-r="1">${esc(ok)}</button></div>`);
    $$("[data-r]", f).forEach(b => b.onclick = () => { fechar(f); res(b.dataset.r === "1"); });
  });
}

/* Pesar */
let catEscolhida = "Boi", loteMemoria = "", sessao = [], desfazer = null;
function renderChips() {
  $("#cat-chips").innerHTML = CATEGORIAS.map(c => `<button type="button" class="chip" aria-pressed="${c === catEscolhida}" data-cat="${c}">${c}</button>`).join("");
}
function renderPesar() {
  const b = normBrinco($("#brinco").value), a = b && ativoPorBrinco(b);
  const box = $("#info-animal"), novo = $("#novo-animal");
  if (a) {
    const m = metricas(a.id);
    const ult = m.ultimo ? `Último peso <b class="num">${kg(m.ultimo.peso)}</b> em ${dataBR(m.ultimo.data)}` : "Sem pesagens";
    box.innerHTML = `<div class="info"><b>${esc(subtitulo(a))}</b><br>${ult}</div>`;
    novo.hidden = true;
  } else if (b) {
    const saiu = db.animais.filter(x => x.brinco === b && x.saida).pop();
    box.innerHTML = `<div class="info novo"><b>Brinco novo.</b> ${saiu ? `O ${esc(b)} anterior saiu em ${dataBR(saiu.saida.data)}. Salvar cria outro animal.` : "Escolha a categoria para cadastrar."}</div>`;
    novo.hidden = false; renderChips();
    if (!$("#novo-lote").value) $("#novo-lote").value = loteMemoria;
  } else { box.innerHTML = ""; novo.hidden = true; }
  const sug = b && !a ? ativos().filter(x => x.brinco.startsWith(b)).slice(0, 5) : [];
  $("#sugestoes").innerHTML = sug.map(x => `<button type="button" class="chip num" data-sug="${esc(x.brinco)}">${esc(x.brinco)}</button>`).join("");
  renderLive();
}
function renderLive() {
  const p = parseNum($("#peso").value), el = $("#peso-live");
  if (!(p > 0)) { el.textContent = ""; return; }
  const a = ativoPorBrinco(normBrinco($("#brinco").value)), m = a && metricas(a.id);
  let t = fmt(arrobas(p), 1) + " @";
  if (m && m.ultimo) t += `, ${sinal(p - m.ultimo.peso, Number.isInteger(p - m.ultimo.peso) ? 0 : 1)} kg desde a última`;
  el.textContent = t;
}
function renderSessao() {
  const el = $("#sessao");
  const ids = sessao.filter(s => db.pesagens.some(p => p.id === s));
  if (!ids.length) { el.innerHTML = ""; return; }
  const ps = ids.map(i => db.pesagens.find(p => p.id === i)).reverse();
  el.innerHTML = `<div class="bloco"><h2>${ps.length} ${ps.length === 1 ? "pesado" : "pesados"} agora</h2><div class="lista">` +
    ps.slice(0, 6).map(p => { const a = animal(p.animalId); return `<button type="button" class="linha" data-ficha="${esc(a.id)}">${tagMini(a.brinco)}<span class="meio">${esc(subtitulo(a))}</span><span class="fim"><b>${kg(p.peso)}</b></span></button>`; }).join("") + `</div></div>`;
}
function erroPesar(m) { const e = $("#erro-pesar"); e.textContent = m || ""; e.hidden = !m; }
async function salvarPesagem() {
  erroPesar("");
  const b = normBrinco($("#brinco").value), p = parseNum($("#peso").value), data = $("#data-pesagem").value;
  if (!b) { erroPesar("Digite o número do brinco."); $("#brinco").focus(); return; }
  if (!(p > 0)) { erroPesar("Digite o peso em kg. Exemplo: 452 ou 452,5."); $("#peso").focus(); return; }
  if (!data || data > hoje()) { erroPesar("A data não pode ser futura."); return; }
  let a = ativoPorBrinco(b);
  const anteriores = a ? pesagensDe(a.id) : [];
  const mesmoDia = anteriores.find(x => x.data === data);
  const ref = anteriores.filter(x => x.data < data).pop();
  if (p < 20 || p > 1500) { if (!await confirmar("Conferir peso", `${kg(p)} está fora do normal para gado. Confirma esse valor?`, "Salvar assim")) return; }
  else if (ref && Math.abs(p - ref.peso) / ref.peso > .25) { if (!await confirmar("Conferir peso", `O brinco ${b} pesava ${kg(ref.peso)} em ${dataBR(ref.data)}. Agora ${kg(p)}. Confirma?`, "Salvar assim")) return; }
  if (mesmoDia && !await confirmar("Já pesado nesse dia", `O brinco ${b} tem ${kg(mesmoDia.peso)} em ${dataBR(data)}. Trocar por ${kg(p)}?`, "Trocar peso")) return;
  let criado = false, antigoPeso = null, reg;
  if (!a) {
    a = { id: novoId(), brinco: b, categoria: catEscolhida, lote: $("#novo-lote").value.trim(), raca: "", obs: "", saida: null };
    db.animais.push(a); criado = true; loteMemoria = a.lote;
  }
  if (mesmoDia) { antigoPeso = mesmoDia.peso; mesmoDia.peso = p; reg = mesmoDia; }
  else { reg = { id: novoId(), animalId: a.id, data, peso: p }; db.pesagens.push(reg); }
  salvar();
  desfazer = { reg, a, criado, antigoPeso };
  if (!sessao.includes(reg.id)) sessao.push(reg.id);
  const det = ref ? (() => { const d = diasEntre(ref.data, data), g = p - ref.peso; return `${sinal(g, Number.isInteger(g) ? 0 : 1)} kg em ${d} ${d === 1 ? "dia" : "dias"}, ${fmt(g / d, 2)} kg/dia`; })() : (criado ? `Cadastrado como ${a.categoria}` : "Primeira pesagem");
  const r = $("#recibo"); r.hidden = false;
  r.innerHTML = `<div class="recibo"><div><strong class="num">${esc(b)}: ${kg(p)}</strong><span class="small">${salvouOk ? det : "Não foi possível gravar no aparelho."}</span></div><button type="button" class="link" data-a="desfazer">Desfazer</button></div>`;
  $("#brinco").value = ""; $("#peso").value = ""; $("#novo-lote").value = "";
  render(); $("#brinco").focus();
}
function desfazerUltima() {
  if (!desfazer) return;
  const { reg, a, criado, antigoPeso } = desfazer;
  if (antigoPeso != null) reg.peso = antigoPeso;
  else { db.pesagens = db.pesagens.filter(p => p.id !== reg.id); sessao = sessao.filter(i => i !== reg.id); }
  if (criado) db.animais = db.animais.filter(x => x.id !== a.id);
  desfazer = null; salvar(); $("#recibo").hidden = true; render(); toast("Pesagem desfeita");
}

/* Rebanho */
let filtroStatus = "ativos";
function renderRebanho() {
  const q = normBrinco($("#busca").value), cat = $("#filtro-cat").value, ord = $("#ordem").value;
  $("#filtro-status").innerHTML = [["ativos", "No curral"], ["saidos", "Saíram"]].map(([v, t]) => `<button class="chip" aria-pressed="${filtroStatus === v}" data-st="${v}">${t}</button>`).join("");
  let l = db.animais.filter(a => filtroStatus === "ativos" ? !a.saida : a.saida).map(a => ({ a, m: metricas(a.id) }));
  if (cat) l = l.filter(x => x.a.categoria === cat);
  if (q) l = l.filter(x => x.a.brinco.includes(q) || x.a.lote.toUpperCase().includes(q));
  const cmp = {
    brinco: (x, y) => x.a.brinco.localeCompare(y.a.brinco, "pt-BR", { numeric: true }),
    peso: (x, y) => (y.m.ultimo?.peso ?? 0) - (x.m.ultimo?.peso ?? 0),
    gmd: (x, y) => (x.m.gmd ?? 1e9) - (y.m.gmd ?? 1e9),
    antigo: (x, y) => (x.m.ultimo?.data ?? "").localeCompare(y.m.ultimo?.data ?? "")
  }[ord];
  l.sort(cmp);
  $("#rebanho-conta").textContent = `${l.length} ${l.length === 1 ? "animal" : "animais"}`;
  const box = $("#lista-animais");
  if (!l.length) {
    box.innerHTML = db.animais.length ? `<div class="vazio"><p>Nenhum animal com esse filtro.</p></div>` : `<div class="vazio"><p>O rebanho aparece aqui depois da primeira pesagem.</p><button class="btn pri" data-v="pesar">Pesar o primeiro animal</button></div>`;
    return;
  }
  box.innerHTML = `<div class="lista">` + l.map(({ a, m }) => {
    const baixo = m.gmd != null && m.gmd < db.config.gmdMinimo;
    const gmd = m.gmd != null ? `<span class="st num ${baixo ? "mau" : "ok"}">${fmt(m.gmd, 2)} kg/dia</span>` : `<span class="st">1 pesagem</span>`;
    const sub = a.saida ? `${a.saida.tipo} em ${dataBR(a.saida.data)}` : (m.ultimo ? `Pesado em ${dataBR(m.ultimo.data)}` : "");
    return `<button class="linha" data-ficha="${esc(a.id)}">${tagMini(a.brinco)}<span class="meio"><b>${esc(subtitulo(a))}</b><span class="small muted">${sub}</span></span><span class="fim"><b>${m.ultimo ? kg(m.ultimo.peso) : "—"}</b>${gmd}</span></button>`;
  }).join("") + `</div>`;
}

/* Ficha */
let fichaAberta = null;
function abrirFicha(id) {
  const a = animal(id); if (!a) return;
  if (fichaAberta) fechar(fichaAberta);
  const m = metricas(id);
  const hist = [...m.ps].reverse().map((p, i, arr) => {
    const ant = arr[i + 1], g = ant ? p.peso - ant.peso : null;

/* Gráficos em SVG puro para funcionar sem internet */
function escala(min, max, n = 4) {
  const bruto = (max - min || 10) / n, pot = 10 ** Math.floor(Math.log10(bruto)), r = bruto / pot;
  const passo = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * pot;
  const ini = Math.floor(min / passo) * passo, fim = Math.ceil(max / passo) * passo, t = [];
  for (let v = ini; v <= fim + 1e-9; v += passo) t.push(v);
  return t;
}
function graficoPeso(ps) {
  const W = 340, H = 180, L = 40, R = 16, T = 14, B = 26;
  const pesos = ps.map(p => p.peso), ticks = escala(Math.min(...pesos), Math.max(...pesos));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1], x0 = diaN(ps[0].data), x1 = diaN(ps[ps.length - 1].data);
  const X = d => L + (diaN(d) - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0 || 1) * (H - T - B);
  const grade = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("");
  const linha = ps.map(p => `${X(p.data).toFixed(1)},${Y(p.peso).toFixed(1)}`).join(" ");
  const pts = ps.map(p => `<circle cx="${X(p.data)}" cy="${Y(p.peso)}" r="4.5" fill="var(--mark)" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const alvos = ps.map(p => `<circle cx="${X(p.data)}" cy="${Y(p.peso)}" r="20" fill="transparent" data-ler="${dataBR(p.data)}: ${kg(p.peso)}"/>`).join("");
  const u = ps[ps.length - 1];
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de ${kg(ps[0].peso)} em ${dataBR(ps[0].data)} até ${kg(u.peso)} em ${dataBR(u.data)}">${grade}
    <text x="${L}" y="${H - 6}">${dataBR(ps[0].data)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dataBR(u.data)}</text>
    <polyline points="${linha}" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round"/>${pts}${alvos}</svg><p class="leitura num">${dataBR(u.data)}: ${kg(u.peso)}</p></div>`;
}
function graficoFaixas(pesos) {
  const min = Math.min(...pesos), max = Math.max(...pesos);
  let passo = 50; if ((max - min) / passo > 10) passo = 100;
  const ini = Math.floor(min / passo) * passo, n = Math.floor((max - ini) / passo) + 1;
  const cont = Array.from({ length: n }, (_, i) => ({ de: ini + i * passo, q: 0 }));
  pesos.forEach(p => cont[Math.floor((p - ini) / passo)].q++);
  const W = 340, H = 170, L = 8, R = 8, T = 22, B = 26, topo = Math.max(...cont.map(c => c.q));
  const bw = (W - L - R) / n, base = H - B;
  const maior = cont.find(c => c.q === topo);
  const rot = c => `${fmt(c.de)} a ${fmt(c.de + passo)} kg: ${c.q} ${c.q === 1 ? "animal" : "animais"}`;
  const barras = cont.map((c, i) => {
    const h = c.q ? Math.max(5, c.q / topo * (base - T)) : 0, x = L + i * bw + 1, w = bw - 2, y = base - h, r = Math.min(4, w / 2, h);
    const forma = h ? `<path d="M${x} ${base}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${base}Z" fill="var(--mark)"/>` : "";
    const rotulo = c === maior ? `<text class="forte" x="${x + w / 2}" y="${y - 6}" text-anchor="middle">${c.q}</text>` : "";
    return forma + rotulo + `<rect x="${L + i * bw}" y="${T - 20}" width="${bw}" height="${H - T}" fill="transparent" data-ler="${rot(c)}"/>`;
  }).join("");
  const eixo = cont.map((c, i) => n <= 6 || i % 2 === 0 ? `<text x="${L + i * bw}" y="${H - 8}">${fmt(c.de)}</text>` : "").join("");
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cont.map(rot).join("; "))}"><line x1="${L}" x2="${W - R}" y1="${base}" y2="${base}" stroke="var(--line)"/>${barras}${eixo}</svg><p class="leitura num">${rot(maior)}</p></div>`;
}
function ligarGrafico(r) {
  $$("[data-ler]", r).forEach(el => el.addEventListener("click", () => { el.closest(".grafico").querySelector(".leitura").textContent = el.dataset.ler; }));
  $$("[data-ler]", r).forEach(el => el.addEventListener("pointerenter", () => { el.closest(".grafico").querySelector(".leitura").textContent = el.dataset.ler; }));
}

/* Backup */
async function entregar(nome, texto, tipo) {
  const arq = new File([texto], nome, { type: tipo });
  if (navigator.canShare && navigator.canShare({ files: [arq] })) {
    try { await navigator.share({ files: [arq] }); return true; } catch (e) { if (e.name === "AbortError") return false; }
  }
  const u = URL.createObjectURL(arq), l = document.createElement("a");
  l.href = u; l.download = nome; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000);
  return true;
}
async function backup() {
  const texto = JSON.stringify({ ...db, ultimoBackup: hoje() }, null, 1);
  if (await entregar(`curral-backup-${hoje()}.json`, texto, "application/json")) { db.ultimoBackup = hoje(); salvar(); render(); toast("Backup gerado"); }
}
async function csv() {
  const cel = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
  const num = n => n == null ? "" : String(n).replace(".", ",");
  const lin = [["Brinco", "Categoria", "Lote", "Raça", "Data", "Peso kg", "Situação"].map(cel).join(";")];
  [...db.pesagens].sort((a, b) => a.data.localeCompare(b.data)).forEach(p => {
    const a = animal(p.animalId);
    lin.push([cel(a.brinco), cel(a.categoria), cel(a.lote), cel(a.raca), cel(dataBR(p.data)), num(p.peso), cel(a.saida ? a.saida.tipo : "No curral")].join(";"));
  });
  await entregar(`curral-pesagens-${hoje()}.csv`, "﻿" + lin.join("\r\n"), "text/csv");
}
async function restaurar(arq, folha) {
  if (!arq) return;
  try {
    const novo = sanear(JSON.parse(await arq.text()));
    const ok = await confirmar("Restaurar backup", `O arquivo tem ${novo.animais.length} animais e ${novo.pesagens.length} pesagens. Isso substitui os dados atuais (${db.animais.length} animais).`, "Substituir dados", true);
    if (!ok) return;
    db = novo; salvar(); fechar(folha); render(); toast("Backup restaurado");
  } catch (e) { toast("Esse arquivo não é um backup do Curral."); }
}

/* Exemplo, sempre marcado como tal */
function carregarExemplo() {
  const base = vazio(); base.exemplo = true; base.config.pesoAlvo = 500;
  const ini = somaDias(hoje(), -96), cats = ["Boi", "Boi", "Garrote", "Boi", "Novilha"];
  for (let i = 0; i < 24; i++) {
    const id = "ex" + i, lote = "Lote " + (i % 3 + 1);
    base.animais.push({ id, brinco: String(1001 + i * 7), categoria: cats[i % 5], lote, raca: "Nelore", obs: "", saida: null });
    const p0 = 330 + (i * 37) % 120, g = .62 + ((i * 13) % 11) * .12;
    const n = i % 8 === 7 ? 3 : 4;
    for (let k = 0; k < n; k++) base.pesagens.push({ id: `exp${i}-${k}`, animalId: id, data: somaDias(ini, k * 32), peso: Math.round(p0 + g * k * 32) });
  }
  db = base; salvar(); render();
}

/* Eventos */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-v]"); if (!t) return;
  const d = t.dataset;
  if (d.v) { ir(d.v); return; }
  if (d.cat) { catEscolhida = d.cat; renderChips(); return; }
  if (d.sug) { $("#brinco").value = d.sug; renderPesar(); $("#peso").focus(); return; }
  if (d.st) { filtroStatus = d.st; renderRebanho(); return; }
  if (d.ficha) { abrirFicha(d.ficha); return; }
  if (d.editp) { formEditarPesagem(d.editp); return; }
  if (d.edita) { formEditarAnimal(d.edita); return; }
  if (d.saida) { formSaida(d.saida); return; }
  if (d.voltar) { animal(d.voltar).saida = null; salvar(); refazFicha(); render(); toast("Animal de volta ao curral"); return; }
  if (d.pesar) { const a = animal(d.pesar); fechar(fichaAberta); fichaAberta = null; ir("pesar"); $("#brinco").value = a.brinco; renderPesar(); $("#peso").focus(); return; }
  switch (d.a) {
    case "fechar": fechar(t.closest(".fundo")); fichaAberta = null; break;
    case "ajustes": formAjustes(); break;
    case "desfazer": desfazerUltima(); break;
    case "exemplo": carregarExemplo(); break;
    case "backup": backup(); break;
    case "csv": csv(); break;
    case "limpar-exemplo": db = vazio(); salvar(); render(); break;
    case "apagar-tudo":
      if (await confirmar("Apagar todos os dados", "Isso apaga animais e pesagens deste aparelho. Só dá para recuperar com um backup.", "Apagar tudo", true)) {
        db = vazio(); salvar(); $$("#sheets > *").forEach(x => x.remove()); fichaAberta = null; document.body.style.overflow = ""; render(); toast("Dados apagados");
      }
      break;
  }
});
$("#form-pesar").addEventListener("submit", e => { e.preventDefault(); salvarPesagem(); });
$("#brinco").addEventListener("input", () => { erroPesar(""); renderPesar(); });
$("#brinco").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#peso").focus(); } });
$("#peso").addEventListener("input", () => { erroPesar(""); renderLive(); });
["#busca", "#filtro-cat", "#ordem"].forEach(s => $(s).addEventListener("input", renderRebanho));
$("#filtro-cat").innerHTML = `<option value="">Todas categorias</option>` + CATEGORIAS.map(c => `<option>${c}</option>`).join("");

carregar();
$("#data-pesagem").value = hoje(); $("#data-pesagem").max = hoje();
if (PREVIEW && !db.animais.length) carregarExemplo();
ir(PREVIEW ? "painel" : "pesar");
try { navigator.storage?.persist?.(); } catch (e) {}
if (!PREVIEW && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
